[build-system]
requires = ["setuptools"]
#build-backend = ["setuptools.build_meta"]

[project]
name = "lmsdisplay"
version = "0.1.0"
description = "Display cover art from Lyrion Music Server to an RGB Matrix display"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "configargparse>=1.7.1",
    "icecream>=2.1.8",
    "pillow>=12.0.0",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "telnetlib3>=2.0.8",
]

[project.scripts]
lmsdisplay = "lmsdisplay:LMSDisplay.main"

[tools.setuptools]
package-dir = {"" = "src"}
packages = [ "lmsdisplay" ]
