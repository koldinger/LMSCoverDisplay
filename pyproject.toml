[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lmsdisplay"
version = "0.1.0"
description = "Display cover art from Lyrion Music Server to an RGB Matrix display"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "configargparse>=1.7.1",
    "flask>=3.1.2",
    "icecream>=2.1.8",
    "lmstools",
    "numpy>=2.3.5",
    "pid>=3.0.4",
    "pillow>=12.0.0",
    "requests>=2.32.3",
    "rich>=13.9.4",
    "telnetlib3>=2.0.8",
]

[project.scripts]
lmsdisplay = "lmsdisplay:cover_display.main"
lmsconfig  = "lmsdisplay:control.main"
lmsremote = "lmsdisplay:remote_control.main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [ "lmsdisplay" ]

[tool.setuptools.package-data]
lmsdisplay = ["static/*", "static/samples/*", "templates/*", "art/*"]

[tool.uv.sources]
lmstools = { git = "https://github.com/koldinger/LMSTools.git" }
