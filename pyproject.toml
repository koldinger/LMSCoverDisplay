[build-system]
requires = ["setuptools >= 80.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "lmsdisplay"
description = "Display cover art from Lyrion Music Server to an RGB Matrix display"
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adafruit-blinka>=9.0.4",
    "adafruit-circuitpython-debouncer>=2.0.14",
    "adafruit-circuitpython-mcp230xx>=2.6.1",
    "flask>=3.1.2",
    "icecream>=2.1.8",
    "lmstools",
    "nmcli>=1.8.0",
    "numpy>=2.3.5",
    "pid>=3.0.4",
    "pillow>=12.0.0",
    "psutil>=7.1.3",
    "qrcode>=8.2",
    "requests>=2.32.3",
    "rich>=13.9.4",
    "strenum>=0.4.15",
    "telnetlib3>=2.0.8",
    "toml>=0.10.2",
    "waitress>=3.0.2",
    "watchfiles>=1.2.0",
]

[project.scripts]
lmsdisplay = "lmsdisplay:cover_display.main"
lmsconfig  = "lmsdisplay:control.main"
lmsremote = "lmsdisplay:remote_control.main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [ "lmsdisplay" ]

[tool.setuptools.package-data]
lmsdisplay = ["static/*", "templates/*", "art/*", "data/*"]

# [tool.setuptools.dynamic]
# dependencies = {file = ["requirements.txt"]}

[tool.setuptools_scm]
version_file = "src/lmsdisplay/_version.py"

[tool.uv.sources]
lmstools = { git = "https://github.com/koldinger/LMSTools.git" }
